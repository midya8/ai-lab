[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "A small, dependency-free LLM evaluation harness for catching prompt/model regressions"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
evalkit = "evalkit.__main__:main"

[tool.setuptools.packages.find]
include = ["evalkit"]
