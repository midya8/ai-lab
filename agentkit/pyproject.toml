[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "A dependency-free Python LLM agent runner (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Midya Rahmani" }]

[project.scripts]
agentkit = "agentkit.__main__:main"

[tool.setuptools.packages.find]
include = ["agentkit*"]
