name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run the demo end to end
        run: |
          python -m agentkit validate examples/add-numbers.json
          python -m agentkit run examples/add-numbers.json --dry-run
          python -m agentkit run examples/add-numbers.json --trace /tmp/agentkit-trace.json --report /tmp/agentkit-report.txt
