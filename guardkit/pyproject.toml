[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guardkit"
version = "0.1.0"
description = "Runtime guardrails for LLM pipelines: prompt-injection scoring, PII/secret redaction, policy file, audit log, adversarial eval"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
guardkit = "guardkit.__main__:main"

[tool.setuptools.packages.find]
include = ["guardkit"]
