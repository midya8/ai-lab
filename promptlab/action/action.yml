name: promptlab regression gate
description: Run a prompt version over test cases and fail if anything that passed in the baseline now fails.
inputs:
  name: {description: Prompt name, required: true}
  cases: {description: JSONL cases file, required: true}
  baseline: {description: Baseline run JSON, required: true}
  root: {description: Registry directory, default: prompts}
  ref: {description: Version ref, default: latest}
  model: {description: "rule | cmd:<command>", default: rule}
  max-regressions: {description: Allowed regressions, default: "0"}
  judge: {description: "Judge model for judge checks: rule | cmd:<command> (empty = judge checks fail)", default: ""}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: "3.11"}
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/..
        PL_ROOT: ${{ inputs.root }}
        PL_NAME: ${{ inputs.name }}
        PL_REF: ${{ inputs.ref }}
        PL_CASES: ${{ inputs.cases }}
        PL_BASELINE: ${{ inputs.baseline }}
        PL_MODEL: ${{ inputs.model }}
        PL_MAXREG: ${{ inputs.max-regressions }}
        PL_JUDGE: ${{ inputs.judge }}
      run: |
        extra=()
        if [ -n "$PL_JUDGE" ]; then extra+=(--judge "$PL_JUDGE"); fi
        python -m promptlab --root "$PL_ROOT" check "$PL_NAME" --ref "$PL_REF" --cases "$PL_CASES" \
          --baseline "$PL_BASELINE" --model "$PL_MODEL" --max-regressions "$PL_MAXREG" \
          --summary "$GITHUB_STEP_SUMMARY" "${extra[@]}"
