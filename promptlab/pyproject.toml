[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlab"
version = "0.4.0"
description = "Prompt versioning, paired A/B comparison with significance tests, and regression gates for LLM prompts"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
promptlab = "promptlab.__main__:main"

[tool.setuptools.packages.find]
include = ["promptlab"]
