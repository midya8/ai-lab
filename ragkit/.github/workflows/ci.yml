name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI
        run: |
          python -m ragkit index examples/docs /tmp/ragkit-index.json
          python -m ragkit ask /tmp/ragkit-index.json "How long do I have to return a bike?"
          python -m ragkit eval /tmp/ragkit-index.json eval/golden.json --fail-below 0.8
