[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "0.1.0"
description = "Local retrieval-augmented generation over your own documents. Stdlib only, no API keys, no server."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ragkit = "ragkit.__main__:main"

[tool.setuptools.packages.find]
include = ["ragkit*"]
